name: pulse

# Routine polling. ESPN headlines and Sleeper trending are small payloads and
# safe to poll often; the Sleeper player map is cached for 6 hours in line with
# their request not to hammer it.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Restore player cache
        uses: actions/cache@v4
        with:
          path: players_cache.json
          key: players-${{ github.run_id }}
          restore-keys: players-

      - name: Scout
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scout.py --mode pulse

      - name: Persist state
        run: |
          git config user.name  "waiver-scout"
          git config user.email "actions@users.noreply.github.com"
          git add state.json || true
          git diff --staged --quiet && exit 0
          git commit -m "state: $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          echo "could not push state" >&2
